name: EPG Comprehensive Processing

on:
  schedule:
    - cron: '12 19 * * *'        # UTC 21:00 → 北京時間 次日05:00；UTC 4:00 → 北京時間 12:00
  workflow_dispatch:              # 支援手動觸發

jobs:
  epg_comprehensive_processing:
    runs-on: ubuntu-latest

    steps:
      # ---------- 1. 環境準備 ----------
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git and pull latest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin ${{ github.ref_name }}

      - name: Set up environments
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libxml2-utils gzip

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          # PHP 依賴
          if [ -f "composer.json" ]; then
            composer install --no-dev --no-progress --no-interaction --prefer-dist
          fi
          # Python 依賴（繁簡轉換 + 福建 EPG 所需）
          pip install opencc curl_cffi beautifulsoup4 opencc requests
          echo "所有依賴安裝完成"
          
      # ---------- 2. 下載 files.json（從 Secret 讀取）中定義的文件 ----------
      - name: Download and extract files from files.json (via Secret)
        id: download_files
        run: |
          FILES_JSON='${{ secrets.FILES_JSON }}'
          if [ -z "$FILES_JSON" ]; then
            echo "錯誤: FILES_JSON secret 未設置，請添加"
            exit 1
          fi
          echo "開始下載 files.json 中定義的文件..."
          echo "$FILES_JSON" | jq -r 'to_entries[] | "\(.key) \(.value)"' | while read -r filename url; do
            echo "下載: $filename <-$url"
            wget -O "$filename" "$url" --retry-connrefused --waitretry=5 --timeout=30 \vert{}\vert{} echo "$filename 下載失敗，跳過"
            if [[ "$filename" == *.gz ]] && [ -f "$filename" ]; then
              echo "解壓文件: $filename"
              gunzip -f "$filename" \vert{}\vert{} echo "解壓失敗或文件已解壓: $filename"
              extracted_file="${filename%.gz}"
              if [ -f "$extracted_file" ]; then
                echo "✓ 解壓成功: $extracted_file"
              fi
            fi
          done
          echo "文件下載和解壓完成"

      # ---------- 3. 處理廣東 EPG ----------
      - name: Process Guangdong EPG
        id: guangdong_epg
        run: |
          echo "開始處理廣東 EPG..."
          if [ -f "epgguangdong.xml" ]; then
            echo "使用已下載的 epgguangdong.xml 文件"
          else
            echo "從 GitHub 下載廣東 EPG..."
            curl -L -o epgguangdong.xml.gz https://raw.githubusercontent.com/litiande03/epg/refs/heads/master/pl.xml.gz || exit 1
            if [ -f "epgguangdong.xml.gz" ]; then
              gunzip -f epgguangdong.xml.gz
              echo "廣東 EPG 下載並解壓完成"
            else
              echo "廣東 EPG 下載失敗"
              echo "guangdong_processed=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          if [ -f "epgguangdong.xml" ] && [ -f "convert.py" ]; then
            echo "運行轉換腳本..."
            python convert.py epgguangdong.xml
            echo "廣東 EPG 處理完成"
            echo "guangdong_processed=true" >> $GITHUB_OUTPUT
            if [ -f "epgguangdong.xml" ]; then
              gzip -k -f epgguangdong.xml
              echo "重新生成 epgguangdong.xml.gz 用於上傳"
            fi
          else
            echo "廣東 EPG 文件或轉換腳本不存在，跳過"
            echo "guangdong_processed=false" >> $GITHUB_OUTPUT
          fi

      # ---------- 4. 檢查 PHP 腳本（用於生成其他 EPG） ----------
      - name: Check PHP scripts exist
        id: check_scripts
        run: |
          echo "檢查 PHP 腳本文件..."
          declare -a scripts=("epglotus.php" "epgtdm.php" "epghenan.php" "epgbaidu.php" "epgkankanlive.php" "epgfenghuangxiu.php" "epgtianying.php" "epgcatchplay.php"  "epghkst.php" "epgjiangsu.php" "epganywhere.php" "epgmytvsuper.php" "epg4gtv2.php" "epgmbcae.php" "epgeltatv.php" "epgsingtel.php" "epgdifang.php" "epgofiii.php" "epgcctv.php" "epgzhongtianam.php" "youtubelivem3u.php" "youtubelivetxt.php" "epgdiyicaijing.php" "epgunifi.php" "epglifetv.php" "epgkbsworld.php" "epgmacocable.php" "epgdubaione.php" "epgasia.php" "epgastrogo.php"  "epgkai1.php" "epggen2.php" "epgnewshanghai.php" "epgnewhebei.php" "epgnewguangdong.php" "youtubelocal.php" "youtubeworld.php" "epgziyong.php")
          existing_scripts=()
          for script in "${scripts[@]}"; do
            if [ -f "$script" ]; then
              echo "✓ 找到文件: $script"
              existing_scripts+=("$script")
            else
              echo "✗ 文件不存在: $script"
            fi
          done
          if [ ${#existing_scripts[@]} -eq 0 ]; then
            echo "警告: 沒有找到任何 PHP 腳本文件，跳過 EPG 生成"
            echo "existing_scripts=" >> $GITHUB_OUTPUT
          else
            scripts_list=$(IFS=,; echo "${existing_scripts[*]}")
            echo "existing_scripts=$scripts_list" >> $GITHUB_OUTPUT
          fi

      # ---------- ★ 運行福建 EPG 抓取 ----------
      - name: Run Fujian EPG scraper
        id: fujian_epg
        continue-on-error: true
        run: |
          if [ -f "epgfujian.py" ]; then
            echo "運行福建 EPG 抓取腳本..."
            python epgfujian.py
            if [ -f "epgfujian.xml" ]; then
              echo "✅ 成功生成 epgfujian.xml"
              echo "fujian_generated=true" >> $GITHUB_OUTPUT
              echo "Fujian EPG updated at $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" > fujian_time.txt
            else
              echo "⚠️ 未生成 epgfujian.xml"
              echo "fujian_generated=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ epgfujian.py 不存在，跳過"
            echo "fujian_generated=false" >> $GITHUB_OUTPUT
          fi

      # ---------- ★ 運行山東 EPG 抓取 ----------
      - name: Run iqilu EPG scraper
        id: epgiqilu
        continue-on-error: true
        run: |
          if [ -f "epgiqilu.py" ]; then
            echo "運行山東 EPG 抓取腳本..."
            # 顯式傳參：北京時間日期 + 輸出文件
            python epgiqilu.py "$(TZ='Asia/Shanghai' date '+%Y-%m-%d')" epgshandong.xml
            if [ -f "epgshandong.xml" ]; then
              echo "✅ 成功生成 epgshandong.xml"
              echo "iqilu_generated=true" >> $GITHUB_OUTPUT
              echo "Shandong EPG updated at $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')" > iqilu_time.txt
            else
              echo "⚠️ 未生成 epgshandong.xml"
              echo "iqilu_generated=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "⚠️ epgiqilu.py 不存在，跳過"
            echo "iqilu_generated=false" >> $GITHUB_OUTPUT
          fi

      # ---------- 5. 運行 PHP 腳本生成各 EPG XML ----------
      - name: Run PHP scripts to generate XML files
        if: steps.check_scripts.outputs.existing_scripts != ''
        run: |
          IFS=',' read -ra scripts <<< "${{ steps.check_scripts.outputs.existing_scripts }}"
          mkdir -p logs
          failed_scripts=()
          for script in "${scripts[@]}"; do
            echo "========================================="
            echo "正在運行: $script"
            start_time=$(date +%s)
            log_file="logs/${script%.php}.log"
            if php "$script" > "$log_file" 2>&1; then
              end_time=$(date +%s)
              duration=$((end_time - start_time))
              echo "✓ $script 執行成功 (耗時: ${duration}秒)"
            else
              end_time=$(date +%s)
              duration=$((end_time - start_time))
              echo "✗ $script 執行失敗！"
              failed_scripts+=("$script")
              echo "--- 最後 20 行日誌 ---"
              tail -n 20 "$log_file" 2>/dev/null || echo "無法讀取日誌文件"
              echo "----------------------"
            fi
            echo "========================================="
          done
          if [ ${#failed_scripts[@]} -gt 0 ]; then
            echo "以下腳本執行失敗: ${failed_scripts[*]}"
          else
            echo "所有 PHP 腳本執行成功"
          fi

      # ---------- 6. 檢查生成的 XML 文件 ----------
      - name: Check generated XML files
        id: check_xml
        run: |
          declare -a expected_xml=("epgtdm.xml" "epghenan.xml" "epgshandong.xml" "egkankantv.xml" "epglotus.xml" "epgkankanlive.xml" "epgbaidu.xml" "epghkst.xml" "epgtianying.xml" "epgfenghuangxiu.xml" "epgcatchplay.xml" "epgjiangsu.xml" "epganywhere.xml" "epg4gtv2.xml" "epgmytvsuper.xml" "epgrthk.xml" "epgeltatv.xml" "epgfujian.xml" "epgmbcae.xml" "epgcatchplay.xml" "epgofiii.xml" "epgtianying.xml" "epgcctv.xml" "epgdifang.xml" "epgzhongtianam.xml" "epgsingtel.xml" "epgguangdong.xml.gz" "epgunifi.xml" "epgkbsworld.xml" "epglifetv.xml" "epgguangdong.xml" "epgmacocable.xml" "epgdubaione.xml" "epgasia.xml" "epgdiyicaijing.xml" "epgastrogo.xml" "epgyidong.xml" "epgfenghuangxiu.xml" "epgshanghai.xml" "epgkai1.
